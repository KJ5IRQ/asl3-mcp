[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allstar-mcp"
version = "0.1.2"
description = "MCP server for AllStar Link — wraps ASL3-API REST endpoints as MCP tools for AI agent control of amateur radio nodes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "allstarlink", "amateur-radio", "asl3", "hamradio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
allstar-mcp = "allstar_mcp.server:main"

[project.urls]
Homepage = "https://github.com/KJ5IRQ/asl3-mcp"
Repository = "https://github.com/KJ5IRQ/asl3-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/allstar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
