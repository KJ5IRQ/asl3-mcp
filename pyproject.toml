[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allstar-mcp"
version = "0.2.0"
description = "Client-neutral stdio MCP adapter for ASL3 Remote Platform vNext"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "allstarlink", "amateur-radio", "asl3", "hamradio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.27,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12", "jsonschema>=4.20"]

[project.scripts]
allstar-mcp = "allstar_mcp.server:main"

[project.urls]
Homepage = "https://github.com/KJ5IRQ/asl3-mcp"
Repository = "https://github.com/KJ5IRQ/asl3-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/allstar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
